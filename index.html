<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Jamie0807 的 GitHub 项目展示主页，自动展示公开仓库。"
    />
    <title>Jamie0807 | GitHub Projects</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #5b6470;
        --line: #d8dee7;
        --paper: #f6f3ee;
        --panel: #ffffff;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --warm: #b45309;
        --shadow: 0 18px 45px rgba(23, 32, 42, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(246, 243, 238, 0.94)),
          var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      .hero {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 24px;
        align-items: center;
        padding: 32px 0 28px;
        border-bottom: 1px solid var(--line);
      }

      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        object-fit: cover;
        background: #e8edf2;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-strong);
        font-size: 0.84rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 5rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .intro {
        max-width: 720px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .migration-note {
        max-width: 780px;
        margin: 16px 0 0;
        padding: 14px 16px;
        border: 1px solid rgba(15, 118, 110, 0.2);
        border-radius: 8px;
        background: rgba(238, 245, 244, 0.84);
        color: var(--accent-strong);
        font-size: 0.98rem;
        font-weight: 650;
        line-height: 1.62;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font-weight: 750;
        box-shadow: 0 8px 20px rgba(23, 32, 42, 0.06);
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 34px 0 18px;
      }

      h2 {
        margin: 0;
        font-size: 1.45rem;
        letter-spacing: 0;
      }

      .repo-count {
        color: var(--muted);
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .repo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .repo-card {
        display: flex;
        min-height: 210px;
        flex-direction: column;
        justify-content: space-between;
        gap: 18px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 32px rgba(23, 32, 42, 0.07);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .repo-card:hover {
        transform: translateY(-3px);
        border-color: rgba(15, 118, 110, 0.45);
        box-shadow: 0 18px 42px rgba(23, 32, 42, 0.11);
      }

      .repo-card h3 {
        margin: 0 0 10px;
        overflow-wrap: anywhere;
        font-size: 1.12rem;
        letter-spacing: 0;
      }

      .repo-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.58;
      }

      .repo-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #eef5f4;
        color: var(--accent-strong);
        font-weight: 700;
      }

      .chip.warm {
        background: #fff3df;
        color: var(--warm);
      }

      .status {
        padding: 28px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        line-height: 1.6;
      }

      footer {
        margin-top: 44px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 680px) {
        .site-shell {
          width: min(100% - 24px, 1120px);
          padding-top: 18px;
        }

        .hero {
          grid-template-columns: 72px minmax(0, 1fr);
          gap: 16px;
          padding-top: 18px;
        }

        .avatar {
          width: 72px;
          height: 72px;
          border-radius: 18px;
        }

        .intro {
          grid-column: 1 / -1;
          margin-top: 12px;
        }

        .migration-note {
          grid-column: 1 / -1;
          font-size: 0.94rem;
        }

        .actions {
          grid-column: 1 / -1;
        }

        .section-head {
          align-items: start;
          flex-direction: column;
          gap: 8px;
        }

        .repo-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="site-shell">
      <section class="hero" aria-labelledby="page-title">
        <img
          class="avatar"
          id="avatar"
          src="https://github.com/Jamie0807.png"
          alt="Jamie0807 GitHub avatar"
          width="96"
          height="96"
        />
        <div>
          <p class="eyebrow">GitHub Portfolio</p>
          <h1 id="page-title">Jamie0807</h1>
          <p class="intro">
          </p>
          <p class="migration-note">
            部分代码仓库由原账号迁移而来，原账号为 @Jamie-qian
          </p>
          <div class="actions" aria-label="Profile links">
            <a class="button primary" href="https://github.com/Jamie0807">GitHub 主页</a>
            <a class="button" href="https://github.com/Jamie0807?tab=repositories">全部仓库</a>
          </div>
        </div>
      </section>

      <section aria-labelledby="repo-title">
        <div class="section-head">
          <h2 id="repo-title">公开项目</h2>
          <span class="repo-count" id="repo-count">正在加载...</span>
        </div>
        <div class="repo-grid" id="repo-grid" aria-live="polite">
          <div class="status">正在从 GitHub 读取项目。</div>
        </div>
      </section>

      <section aria-labelledby="fork-title">
        <div class="section-head">
          <h2 id="fork-title">Fork 项目</h2>
          <span class="repo-count" id="fork-count">正在加载...</span>
        </div>
        <div class="repo-grid" id="fork-grid" aria-live="polite">
          <div class="status">正在从 GitHub 读取 Fork 项目。</div>
        </div>
      </section>
    </main>

    <footer class="site-shell">
      <span>Powered by GitHub Pages</span>
    </footer>

    <script>
      const userName = "Jamie0807";
      const repoGrid = document.querySelector("#repo-grid");
      const repoCount = document.querySelector("#repo-count");
      const forkGrid = document.querySelector("#fork-grid");
      const forkCount = document.querySelector("#fork-count");
      const avatar = document.querySelector("#avatar");
      const repoCacheKey = "jamie0807-public-repos";
      const staticReposUrl = "data/repos.json";
      const apiUrl =
        "https://api.github.com/users/Jamie0807/repos?sort=pushed&per_page=100";

      function formatDate(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "short",
          day: "numeric",
        }).format(new Date(value));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getReadmeSummary(markdown) {
        const lines = markdown
          .replaceAll("\r\n", "\n")
          .split("\n")
          .map((line) =>
            line
              .replace(/^#{1,6}\s+/, "")
              .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
              .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
              .replace(/[*_`>#-]/g, "")
              .trim()
          )
          .filter(Boolean);

        const firstTextLine = lines.find((line) => line.length > 20) || lines[0];

        if (!firstTextLine) {
          return "";
        }

        return firstTextLine.length > 150
          ? `${firstTextLine.slice(0, 147)}...`
          : firstTextLine;
      }

      function decodeBase64Content(content) {
        const binary = atob(content.replace(/\s/g, ""));
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder("utf-8").decode(bytes);
      }

      function readCachedRepos() {
        try {
          const cached = localStorage.getItem(repoCacheKey);
          return cached ? JSON.parse(cached) : [];
        } catch (error) {
          console.warn("Repository cache unavailable", error);
          return [];
        }
      }

      function writeCachedRepos(repos) {
        try {
          localStorage.setItem(repoCacheKey, JSON.stringify(repos));
        } catch (error) {
          console.warn("Repository cache could not be saved", error);
        }
      }

      async function fetchReadmeSummary(repo) {
        if (repo.readmeSummary) {
          return repo.readmeSummary;
        }

        try {
          const response = await fetch(
            `https://api.github.com/repos/${userName}/${repo.name}/readme`,
            { headers: { Accept: "application/vnd.github+json" } }
          );

          if (!response.ok) {
            return "";
          }

          const readme = await response.json();
          return getReadmeSummary(decodeBase64Content(readme.content || ""));
        } catch (error) {
          console.warn(`README unavailable for ${repo.name}`, error);
          return "";
        }
      }

      async function loadStaticRepos() {
        const response = await fetch(staticReposUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Static repository data returned ${response.status}`);
        }

        const repos = await response.json();
        return Array.isArray(repos) ? repos : repos.repositories || [];
      }

      async function addReadmeSummaries(repos) {
        const sortedRepos = [...repos].sort(
          (a, b) => new Date(b.pushed_at) - new Date(a.pushed_at)
        );
        const reposNeedingReadme = sortedRepos
          .filter((repo) => !repo.description)
          .slice(0, 24);
        const summaries = await Promise.all(
          reposNeedingReadme.map(async (repo) => [repo.id, await fetchReadmeSummary(repo)])
        );
        const summaryByRepoId = new Map(summaries);

        return repos.map((repo) => ({
          ...repo,
          readmeSummary: summaryByRepoId.get(repo.id) || "",
        }));
      }

      function renderRepoCards(targetGrid, repos, emptyMessage) {
        if (repos.length === 0) {
          targetGrid.innerHTML = `<div class="status">${emptyMessage}</div>`;
          return;
        }

        targetGrid.innerHTML = repos
          .map((repo) => {
            const description =
              repo.description || repo.readmeSummary || "这个项目还没有填写简介。";
            const language = repo.language
              ? `<span class="chip">${escapeHtml(repo.language)}</span>`
              : "";
            const stars =
              repo.stargazers_count > 0
                ? `<span class="chip warm">Stars ${repo.stargazers_count}</span>`
                : "";

            return `
              <a class="repo-card" href="${repo.html_url}" aria-label="Open ${escapeHtml(repo.name)} on GitHub">
                <div>
                  <h3>${escapeHtml(repo.name)}</h3>
                  <p>${escapeHtml(description)}</p>
                </div>
                <div class="repo-meta">
                  ${language}
                  ${stars}
                  <span>代码维护于 ${formatDate(repo.pushed_at)}</span>
                </div>
              </a>
            `;
          })
          .join("");
      }

      function renderRepos(repos) {
        const sortedRepos = [...repos].sort(
          (a, b) => new Date(b.pushed_at) - new Date(a.pushed_at)
        );
        const originalRepos = sortedRepos.filter((repo) => !repo.fork);
        const forkRepos = sortedRepos.filter((repo) => repo.fork);

        repoCount.textContent = `${originalRepos.length} 个公开项目`;
        forkCount.textContent = `${forkRepos.length} 个 Fork 项目`;
        renderRepoCards(repoGrid, originalRepos, "暂时没有可展示的公开项目。");
        renderRepoCards(forkGrid, forkRepos, "暂时没有可展示的 Fork 项目。");
      }

      function renderError(error) {
        const cachedRepos = readCachedRepos();

        if (cachedRepos.length > 0) {
          renderRepos(cachedRepos);
          return;
        }

        repoCount.textContent = "读取失败";
        forkCount.textContent = "读取失败";
        repoGrid.innerHTML = `
          <div class="status">
            GitHub API 可能限流或暂时不可访问。可以刷新页面，或直接访问
            <a href="https://github.com/${userName}?tab=repositories">GitHub 仓库列表</a>。
          </div>
        `;
        forkGrid.innerHTML = '<div class="status">Fork 项目暂时无法读取。</div>';
        console.error(error);
      }

      async function loadRepos() {
        try {
          const response = await fetch(apiUrl, {
            headers: { Accept: "application/vnd.github+json" },
          });

          if (!response.ok) {
            throw new Error(`GitHub API returned ${response.status}`);
          }

          const repos = await response.json();
          writeCachedRepos(repos);
          if (repos[0]?.owner?.avatar_url) {
            avatar.src = repos[0].owner.avatar_url;
          }
          renderRepos(await addReadmeSummaries(repos));
        } catch (error) {
          try {
            const staticRepos = await loadStaticRepos();
            writeCachedRepos(staticRepos);
            if (staticRepos[0]?.owner?.avatar_url) {
              avatar.src = staticRepos[0].owner.avatar_url;
            }
            renderRepos(staticRepos);
          } catch (staticError) {
            console.error(staticError);
            renderError(error);
          }
        }
      }

      loadRepos();
    </script>
  </body>
</html>
